[package]
name = "auth-service"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
argon2 = { version = "0.5.3", features = ["std"] }
async-trait = "0.1.89"
axum = "0.8.6"
axum-extra = { version = "0.12.5", features = ["cookie"] }
chrono = "0.4.43"
confique = { version = "0.4.0", features = ["yaml"] }
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.3.0", features = ["aws-lc-rs", "aws_lc_rs"] }
lazy_static = "1.5.0"
quickcheck = "1.0.3"
quickcheck_macros = "1.1.0"
rand = "0.9.2"
redis = { version = "1.2.0", features = ["tokio-comp"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sqlx = { version = "0.8.6", features = [
  "postgres",
  "migrate",
  "runtime-tokio-rustls",
] }
tokio = { version = "1.48.0", features = ["full"] }
tower-http = { version = "0.6.6", features = ["cors", "fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = [
  "env-filter",
  "registry",
] }
uuid = { version = "1.19.0", features = ["v4", "serde", "v7"] }
validator = { version = "0.19.0", features = ["derive"] }

[dev-dependencies]
fake = "4.4.0"
reqwest = { version = "0.13.1", features = ["json", "form", "cookies"] }
test-helpers = { path = "../test-helpers" }
